<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Emotion Detection</h1>
    <p>Enter a sentence and analyze its emotions with IBM Watson NLP.</p>
    <form id="emotion-form">
      <textarea id="textToAnalyze" name="textToAnalyze" rows="6"
        placeholder="Example: I am very happy today."></textarea>
      <button type="submit">Analyze Emotion</button>
    </form>
    <pre id="result" aria-live="polite"></pre>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
